<?xml version="1.0" encoding="UTF-8"?>
<svg id="svgcontent_sequential_example" width="280" height="148" viewBox="0 0 280 148" fill="#000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="WaveDrom"><style>.pinname {font-size:12px; font-style:normal; font-variant:normal; font-weight:500; font-stretch:normal; text-align:center; text-anchor:end; font-family:monospace} .wirename {font-size:12px; font-style:normal; font-variant:normal; font-weight:500; font-stretch:normal; text-align:center; text-anchor:start; font-family:monospace} .wirename:hover {fill:blue} .gate {color:#000; fill:#aaa; fill-opacity: 1;stroke:#000; stroke-width:1; stroke-opacity:1} .dff {color:#000; fill:#777; fill-opacity: 1; stroke:#000; stroke-width:1; stroke-opacity:1} .dff:hover {fill:#ff7 !important; } .gate:hover {fill:red !important; } .port {color:#000; fill:#cce; fill-opacity:1; stroke:#000; stroke-width:1; stroke-opacity:1} .port:hover {fill:#aaf !important; } .bind {color:#000; fill:#ecc; fill-opacity:1; stroke:#000; stroke-width:1; stroke-opacity:1} .bind:hover {fill:#faa !important; } .siglabel {fill:#eee; fill-opacity:1; stroke:#ccc; stroke-width:1} .slicelabel {font-size:12px; font-family:monospace; text-anchor:middle; font-weight:500; paint-order:stroke; stroke:#fff; stroke-width:3; fill:#000} .bodylabel {font-size:12px; font-family:monospace; text-anchor:middle; font-weight:500; fill:#000} .wire {fill:none; stroke:#000; stroke-width:1; stroke-opacity:1} .wire.vector {stroke-width:3} .wire.zeroer {stroke-width:0.5; stroke-dasharray:2,2} .grid {fill:#fff; fill-opacity:1; stroke:none}</style><rect width="280" height="148" fill="white" stroke="none"/><g transform="translate(20,20)"><g data-symbol="DFF"><title>DFF U1 (graphical symbol; no simulation)</title><text x="80" y="12" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">U1</text><rect data-role="body" class="gate" x="80" y="20" width="80" height="64" fill="#aaa" stroke="#000" stroke-width="1"/><text x="120" y="32" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" text-anchor="middle" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500;text-anchor:middle">DFF</text><g data-port="D"><path d="M64,44H80" fill="none" stroke="#000" stroke-width="1"/><g data-role="net-label"><rect x="0" y="36" width="64" height="16" fill="#eee" stroke="#ccc" stroke-width="1"/><text x="4" y="48" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">request</text></g><text x="84" y="48" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">D</text></g><g data-port="CLK"><path d="M64,60H80" fill="none" stroke="#000" stroke-width="1"/><path data-role="clock-edge" d="M80,56l6,4 -6,4" fill="none" stroke="#000" stroke-width="1"/><g data-role="net-label"><rect x="32" y="52" width="32" height="16" fill="#eee" stroke="#ccc" stroke-width="1"/><text x="36" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">clk</text></g><text x="90" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">CLK</text></g><g data-port="RESET" data-asynchronous="true"><path d="M64,76H74" fill="none" stroke="#000" stroke-width="1"/><circle data-role="inversion" cx="77" cy="76" r="3" fill="#aaa" stroke="#000" stroke-width="1"/><g data-role="net-label"><rect x="0" y="68" width="64" height="16" fill="#eee" stroke="#ccc" stroke-width="1"/><text x="4" y="80" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">reset_n</text></g><text x="84" y="80" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">R</text><text x="96" y="80" font-family="monospace" font-size="9" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:9px;fill:#000;stroke:none;font-weight:500">async</text></g><g data-role="output" data-port="Q"><path d="M160,44H176" fill="none" stroke="#000" stroke-width="1"/><text x="156" y="48" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" text-anchor="end" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500;text-anchor:end">Q</text><g data-role="net-label"><rect x="176" y="36" width="48" height="16" fill="#eee" stroke="#ccc" stroke-width="1"/><text x="180" y="48" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">ready</text></g></g><g data-role="output" data-port="QN"><path d="M166,60H176" fill="none" stroke="#000" stroke-width="1"/><circle data-role="inversion" cx="163" cy="60" r="3" fill="#aaa" stroke="#000" stroke-width="1"/><text x="156" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" text-anchor="end" text-decoration="overline" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500;text-anchor:end;text-decoration:overline">Q</text><g data-role="net-label"><rect x="176" y="52" width="64" height="16" fill="#eee" stroke="#ccc" stroke-width="1"/><text x="180" y="64" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500">ready_n</text></g></g><text x="120" y="96" font-family="monospace" font-size="12" font-weight="500" fill="#000" stroke="none" text-anchor="middle" style="font-family:monospace;font-size:12px;fill:#000;stroke:none;font-weight:500;text-anchor:middle">initial output = 0</text></g></g></svg>
